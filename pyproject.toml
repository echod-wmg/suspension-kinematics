[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "suspkin"
version = "1.0.0"
description = "3-D kinematics of double wishbone and MacPherson suspensions (camber, toe, caster, KPI, scrub, HTC, roll centre)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emil Chodowiec" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "matplotlib>=3.5"]
keywords = ["vehicle dynamics", "suspension", "kinematics", "double wishbone", "macpherson"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "openpyxl>=3.1"]
app = ["streamlit>=1.30"]

[project.scripts]
suspkin = "suspkin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"validation/*.py" = ["E402"]
